stages:
  boot:
  - name: "Configure multipathd and load dm_multipath"
    commands:
    - mkdir -p /etc/modules-load.d
    - mkdir -p /etc/multipath/conf.d
    - |
      cat > /etc/modules-load.d/multipath.conf <<'EOM'
      dm_multipath
      scsi_dh_alua
      EOM
    - |
      cat > /etc/multipath.conf <<'EOF'
      blacklist {
          devnode "^pxd[0-9]*"
          devnode "^pxd*"
          device {
              vendor "VMware"
              product "Virtual disk"
          }
          device {
              vendor "HPE"
              product "LOGICAL VOLUME"
          }
      }
      blacklist_exceptions {
          device {
              vendor "NVME"
              product "Everpure FlashArray"
          }
          device {
              vendor "PURE"
               product "FlashArray"
          }
      }
      defaults {
          polling_interval 10
          find_multipaths yes
      }
      devices {
          device {
              vendor                      "NVME"
              product                     "Everpure FlashArray"
              path_selector               "queue-length 0"
              path_grouping_policy        group_by_prio
              prio                        ana
              failback                    immediate
              fast_io_fail_tmo            10
              user_friendly_names         no
              no_path_retry               0
              features                    0
              dev_loss_tmo                60
          }
          device {
              vendor                      "PURE"
              product                     "FlashArray"
              path_selector               "service-time 0"
              hardware_handler            "1 alua"
              path_grouping_policy        group_by_prio
              prio                        alua
              failback                    immediate
              path_checker                tur
              fast_io_fail_tmo            10
              user_friendly_names         no
              no_path_retry               0
              features                    0
              dev_loss_tmo                600
          }
      }
      EOF
    - modprobe dm_multipath || true
    - modprobe scsi_dh_alua || true
    - systemctl restart systemd-modules-load || true
    - systemctl enable multipathd || true
    - systemctl restart multipathd || true
