# Device tuning only. Blacklists and exceptions come from the profile
# multipath block (os.external_storage_config); multipathd reads this
# drop-in in addition to /etc/multipath.conf.
stages:
  boot:
  - name: "Pure multipath device tuning"
    files:
    - path: /etc/multipath/conf.d/90-pure.conf
      permissions: 0644
      owner: 0
      group: 0
      content: |
        blacklist {
            devnode "^pxd[0-9]*"
        }
        defaults {
            polling_interval 10
            find_multipaths yes
        }
        devices {
            device {
                vendor                      "NVME"
                product                     "Everpure FlashArray"
                path_selector               "queue-length 0"
                path_grouping_policy        group_by_prio
                prio                        ana
                failback                    immediate
                fast_io_fail_tmo            10
                user_friendly_names         no
                no_path_retry               0
                features                    0
                dev_loss_tmo                60
            }
            device {
                vendor                      "PURE"
                product                     "FlashArray"
                path_selector               "service-time 0"
                hardware_handler            "1 alua"
                path_grouping_policy        group_by_prio
                prio                        alua
                failback                    immediate
                path_checker                tur
                fast_io_fail_tmo            10
                user_friendly_names         no
                no_path_retry               0
                features                    0
                dev_loss_tmo                600
            }
        }
    commands:
    - systemctl reload multipathd || systemctl restart multipathd
