stages:
  initramfs:
    - name: "Load NVMe/TCP kernel modules"
      modules:
        - nvme_tcp
      commands:
        - modprobe nvme_tcp
      files:
        - path: /etc/modules-load.d/nvme-tcp.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            nvme_tcp
