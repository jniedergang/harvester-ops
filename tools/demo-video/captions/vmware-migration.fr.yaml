card.title: "De VMware à Harvester, à chaud et en vue"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Outil libre pour SUSE Harvester"

source: "Une VM qui tourne sur VMware : son écran montre le système vivant, avec un compteur des écritures qu'il ne cesse de faire."
intro: "Dans harvops, la source vCenter : identifiants vérifiés, inventaire prêt."
inventory: "Ses VMs, réseaux et datastores, tels que Forklift les voit."
lanes: "La vague se copie pendant que la VM tourne : une première copie, puis des copies incrémentales. Les couloirs mettent toutes les vagues sur un même axe du temps."
follow: "Le suivi de la vague : chaque VM, chaque copie, et pourquoi l'une a échoué si c'est le cas."
cutover: "Basculer maintenant : une dernière copie incrémentale, la source s'arrête, la VM démarre sur Harvester."
cutoverDone: "C'est fait : la vague a basculé."
target: "La VM est maintenant sur Harvester."
targetAlive: "Son écran : le même système, le compteur d'écritures reprend où il s'était arrêté."
global: "Toutes les vagues de tous les clusters déclarés, sur le même axe."
outro: "Beaucoup de VMs, une coupure courte, tout en vue."
