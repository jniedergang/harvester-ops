card.title: "VMware to Harvester, warm, and visible"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Open source toolkit for SUSE Harvester"

source: "A VM running on VMware: its screen shows the system alive, with a counter of the writes it keeps making."
intro: "In harvops, the vCenter source: credentials checked, inventory ready."
inventory: "Its VMs, networks and datastores, as Forklift sees them."
lanes: "The wave is being copied while the VM keeps running: a first copy, then incremental ones. Lanes put every wave on one time axis."
follow: "Following the wave: each VM, each copy, and why one failed when one does."
cutover: "Switch over now: one last incremental copy, the source stops, the VM starts on Harvester."
cutoverDone: "Done: the wave has switched over."
target: "The VM is now on Harvester."
targetAlive: "Its screen: the same system, the write counter carries on where it stopped."
global: "Every wave on every declared cluster, on the same axis."
outro: "Many VMs, a short interruption, everything in sight."
