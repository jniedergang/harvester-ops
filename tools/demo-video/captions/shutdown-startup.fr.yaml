card.title: "Éteindre un cluster, et le remonter"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Outil libre pour SUSE Harvester"

intro: "Un cluster Harvester n'aime pas qu'on le coupe au disjoncteur. Voici la manière ordonnée."
steps: "Huit étapes : contrôler le cluster, arrêter les machines, calmer le stockage, puis les nœuds, un par un."
options: "Au choix : photographier les machines d'abord, ou forcer le passage sur une VM qui refuse de s'arrêter."
launch: "C'est parti. La même séquence existe en ligne de commande, c'est elle qu'on utilise sur un site coupé du réseau."
running: "Chaque étape rend compte au fur et à mesure, et interrompt la suite si un contrôle échoue."
down: "Le cluster est éteint. Rien n'a été laissé à un délai d'attente."
powerOn: "On rallume les machines, à la main, par leur carte d'administration, ou par Wake-on-LAN."
startup: "Le démarrage fait l'inverse : attendre le premier nœud, puis le cluster, puis le stockage, puis les machines."
startupRunning: "Il attend ce dont il a besoin au lieu de le deviner : l'ordre est toujours bon."
back: "Le cluster est revenu, avec ses machines là où elles doivent être."
outro: "Éteint le vendredi, revenu le lundi, depuis une console ou une commande."
