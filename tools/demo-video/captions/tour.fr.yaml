card.title: "Le tour de harvester-ops"
card.title.sub: "Tout ce que contient le menu de gauche"
card.end: "harvester-ops"
card.end.sub: "Outil libre pour SUSE Harvester"

intro: "Une console pour un cluster Harvester. Voici tout ce qu'elle fait, en descendant le menu."
metrics: "Métriques : le cluster d'un coup d'œil, les nœuds, la charge, la capacité et les alertes qui comptent."
cluster: "Cluster : chaque hôte en bloc, avec les machines qu'il fait tourner. Maintenance et migrations partent d'ici."
network: "Réseau : les réseaux du cluster et ce qui y est raccordé, machine par machine."
storage: "Stockage : classes de stockage, volumes et disques des nœuds, avec la place réellement disponible."
fabric: "Fabrique : le côté physique, cartes réseau, agrégats et les commutateurs virtuels au-dessus."
startup: "Démarrage : remonter tout un cluster dans l'ordre, des machines jusqu'au dernier contrôle."
shutdown: "Extinction : la raison d'être de l'outil. Un arrêt gracieux en huit étapes, chacune vérifiée avant la suivante."
vms: "Machines virtuelles : créer, démarrer, arrêter, photographier, modifier, ouvrir une console. En masse si besoin."
capi: "Cluster API : déclarer des clusters Kubernetes au-dessus de Harvester, et suivre leur construction."
terraform: "Terraform : lancer son code d'infrastructure d'ici, avec le plan montré avant toute application."
baremetal: "Bare-metal : trouver les machines par leur carte d'administration et installer Harvester sur une machine vierge, sans y toucher."
activity: "Activité : toutes les actions passées, avec leur journal conservé. Rien ne se fait sans trace."
settings: "Réglages : apparence, langues, clusters, comptes, et un paquet de support en un clic."
languages: "Toute l'interface existe en cinq langues, changées sur-le-champ."
outro: "Le tout fonctionne hors ligne, depuis un seul tarball signé, sur le cluster que vous avez déjà."
