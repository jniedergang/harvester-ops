card.title: "Instantanés et restauration"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Outil libre pour SUSE Harvester"

intro: "Les instantanés, montrés avec une preuve qu'on peut lire à l'écran."
write: "D'abord, on laisse une trace dans la machine : un fichier qui dit v1."
snapshot: "Puis un instantané de toute la machine, depuis son panneau."
snapReady: "L'instantané est prêt."
change: "Maintenant la machine change : le fichier dit v2."
restore: "On restaure l'instantané."
restoreOpts: "Deux précautions, cochées d'office : un instantané de sécurité de l'état actuel d'abord, et la machine arrêtée proprement."
start: "Restaurée. Harvester laisse la machine arrêtée ; on la relance depuis la console."
proof: "Le fichier dit de nouveau v1 : la machine est revenue exactement à l'instant de l'instantané."
