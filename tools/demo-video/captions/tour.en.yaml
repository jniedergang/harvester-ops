card.title: "A tour of harvester-ops"
card.title.sub: "Everything in the left-hand menu"
card.end: "harvester-ops"
card.end.sub: "Open source toolkit for SUSE Harvester"

intro: "One console for a Harvester cluster. Here is everything it does, going down the menu."
metrics: "Metrics: the cluster at a glance, nodes, load, capacity, and the alerts that matter."
cluster: "Cluster: every host as a block, with the machines it runs. Maintenance and migrations start here."
network: "Network: the networks of the cluster and what is attached to them, machine by machine."
storage: "Storage: storage classes, volumes and node disks, with the space actually left."
fabric: "Fabric: the physical side, network cards, bonds and the virtual switches above them."
startup: "Startup: bring a whole cluster back up in order, from the machines to the last check."
shutdown: "Shutdown: the reason this toolkit exists. A graceful shutdown in eight steps, each one checked before the next."
vms: "Virtual machines: create, start, stop, snapshot, edit, open a console. In bulk if needed."
capi: "Cluster API: declare Kubernetes clusters on top of Harvester, and follow them being built."
terraform: "Terraform: run your infrastructure code from here, with the plan shown before anything is applied."
baremetal: "Bare-metal: find the machines by their management board and install Harvester on a blank one, without touching it."
activity: "Activity: every action ever run, with its log kept. Nothing happens without a trace."
settings: "Settings: appearance, languages, clusters, accounts, and a support bundle in one click."
languages: "The whole interface exists in five languages, changed on the spot."
outro: "All of it works offline, from one signed tarball, against the cluster you already have."
