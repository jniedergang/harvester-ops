card.title: "Snapshots and restore"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Open source toolkit for SUSE Harvester"

intro: "Snapshots, shown with a proof you can read on screen."
write: "First, we leave a mark inside the machine: a file that says v1."
snapshot: "Then a snapshot of the whole machine, from its panel."
snapReady: "The snapshot is ready."
change: "Now the machine changes: the file says v2."
restore: "Restore the snapshot."
restoreOpts: "Two safeguards, on by default: a safety snapshot of the current state first, and the machine stopped cleanly."
start: "Restored. Harvester leaves the machine stopped; we start it again from the console."
proof: "The file says v1 again: the machine is back exactly as it was at the snapshot."
