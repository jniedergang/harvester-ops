card.title: "Shutting a cluster down, and bringing it back"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Open source toolkit for SUSE Harvester"

intro: "A Harvester cluster does not like being switched off at the wall. This is the ordered way."
steps: "Eight steps: check the cluster, stop the machines, calm the storage, then the nodes, one after another."
options: "Optional: snapshot the machines first, or force past a VM that refuses to stop."
launch: "Off we go. The same sequence runs from the command line, which is what an airgapped site uses."
running: "Every step reports as it happens, and stops the sequence if a check fails."
down: "The cluster is off. Nothing was left to a timeout."
powerOn: "The machines are powered back on, by hand, by their management board, or by Wake-on-LAN."
startup: "Startup does the reverse: wait for the first node, for the cluster, for the storage, then the machines."
startupRunning: "It waits for what it needs instead of guessing, so the order is always right."
back: "The cluster is back, with its machines running where they belong."
outro: "Shut down on Friday, back on Monday, from one console or one command."
