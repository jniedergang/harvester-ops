# Sous-titres anglais (voir la version .fr.yaml : mêmes clés).
card.title: "Cluster view and node maintenance"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Open source toolkit for SUSE Harvester"

intro: "The Cluster view: every host of the cluster, with the virtual machines it currently runs."
hosts: "One block per host, with its CPU and memory gauges. Nothing to arrange by hand, it follows the cluster."
vmCards: "Hover a machine and it shows its size, disks, network cards and address."
nodePanel: "Clicking a host opens its panel: state, roles, allocated resources, and the actions allowed on it."
precheck: "Before any maintenance, the console asks the cluster what would happen."
precheckDetail: "Which machines migrate live, which ones would be shut down, and what would hold the drain for ever. Nothing has changed yet."
enter: "Now we really do it: the host is drained and put in maintenance."
dock: "Every operation is tracked. The dock follows it live, and the log is kept in Activity."
waiting: "Harvester live-migrates the machines to the other hosts. No downtime for them."
moved: "The host is in maintenance and empty. Its machines are running on the other two."
leave: "Leaving maintenance gives the host back to the cluster."
back: "The host is available again. The whole thing is one click away, on a real cluster."
migrate: "A single machine can be moved by hand too, live, without shutting it down."
migrateDone: "Moved. Every action here is the one an operator would run by hand, without the risk of forgetting a step."
