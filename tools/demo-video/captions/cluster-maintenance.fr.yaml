# Sous-titres français (voir la version .en.yaml : mêmes clés).
card.title: "Vue Cluster et maintenance d'un nœud"
card.title.sub: "harvester-ops"
card.end: "harvester-ops"
card.end.sub: "Outil libre pour SUSE Harvester"

intro: "La vue Cluster : chaque hôte du cluster, avec les machines virtuelles qu'il fait tourner."
hosts: "Un bloc par hôte, avec ses jauges de processeur et de mémoire. Rien à disposer à la main, ça suit le cluster."
vmCards: "Au survol, une machine montre sa taille, ses disques, ses cartes réseau et son adresse."
nodePanel: "Cliquer sur un hôte ouvre son panneau : état, rôles, ressources allouées et actions permises."
precheck: "Avant toute maintenance, la console demande au cluster ce qui se passerait."
precheckDetail: "Quelles machines migrent à chaud, lesquelles seraient arrêtées, et ce qui bloquerait la vidange pour toujours. Rien n'a encore changé."
enter: "Cette fois on le fait pour de vrai : l'hôte est vidé puis mis en maintenance."
dock: "Toute opération est tracée. Le dock la suit en direct, et le journal reste dans Activité."
waiting: "Harvester migre les machines à chaud vers les autres hôtes. Aucune coupure pour elles."
moved: "L'hôte est en maintenance et vide. Ses machines tournent sur les autres hôtes."
leave: "Sortir de maintenance rend l'hôte au cluster."
back: "L'hôte est de nouveau disponible. Tout cela tient en un clic, sur un vrai cluster."
migrate: "Une machine seule se déplace aussi à la main, à chaud, sans l'éteindre."
migrateDone: "Déplacée. Chaque action reprend ce qu'un opérateur ferait à la main, sans le risque d'oublier une étape."
