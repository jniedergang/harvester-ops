# kube-vip pour les clusters créés par Cluster API (v1.52.0).
# Rendu tel quel du sous-chart kube-vip du chart harvester-cloud-provider
# 0.2.15 (https://charts.harvesterhci.io), avec les valeurs de ce chart :
#   helm template kube-vip charts/kube-vip -n kube-system -f <valeurs kube-vip>
#     --set global.cattle.systemDefaultRegistry=""
# Le fournisseur de cloud Harvester (posé par CAPHV) attend kube-vip pour
# annoncer l'adresse des services LoadBalancer ; CAPHV ne le pose pas.
---
# Source: kube-vip/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    helm.sh/chart: kube-vip-0.11.0
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/instance: kube-vip
    app.kubernetes.io/version: "v1.2.2"
    app.kubernetes.io/managed-by: Helm
---
# Source: kube-vip/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: "true"
  name: kube-vip
rules:
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "watch", "update", "create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
# Source: kube-vip/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip
  labels:
    helm.sh/chart: kube-vip-0.11.0
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/instance: kube-vip
    app.kubernetes.io/version: "v1.2.2"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip
subjects:
- kind: ServiceAccount
  name: kube-vip
  namespace: kube-system
---
# Source: kube-vip/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    helm.sh/chart: kube-vip-0.11.0
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/instance: kube-vip
    app.kubernetes.io/version: "v1.2.2"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "get"]
---
# Source: kube-vip/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    helm.sh/chart: kube-vip-0.11.0
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/instance: kube-vip
    app.kubernetes.io/version: "v1.2.2"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-vip
subjects:
- kind: ServiceAccount
  name: kube-vip
  namespace: kube-system
---
# Source: kube-vip/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
      app.kubernetes.io/instance: kube-vip
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
        app.kubernetes.io/instance: kube-vip
    spec:
      containers:
      - args:
          - manager
        env:
          - name: "cp_enable"
            value: "false"
          - name: "lb_enable"
            value: "true"
          - name: "lb_port"
            value: "6443"
          - name: "prometheus_server"
            value: ":2112"
          - name: "svc_election"
            value: "false"
          - name: "svc_enable"
            value: "true"
          - name: "vip_arp"
            value: "true"
          - name: "vip_interface"
            value: ""
          - name: "vip_leaderelection"
            value: "false"
          - name: "vip_subnet"
            value: "32"
        image: rancher/mirrored-kube-vip-kube-vip-iptables:v1.2.3
        imagePullPolicy: IfNotPresent
        name: kube-vip
        resources:
          {}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            drop:
            - ALL
      hostNetwork: true
      serviceAccountName: kube-vip
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoExecute
          key: node-role.kubernetes.io/etcd
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/controlplane
                operator: Exists
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
